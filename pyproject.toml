[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ogcapi"
dynamic = ["version"]
description = "Pydantic models for the OGC API - Features standards, extending pydantic-geojson."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Josh Hansen", email = "josh@skwash.net" }]
keywords = ["ogc", "ogcapi", "geojson", "pydantic", "features", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-geojson>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/skwash/pydantic-ogcapi"
Repository = "https://github.com/skwash/pydantic-ogcapi"
Issues = "https://github.com/skwash/pydantic-ogcapi/issues"

[tool.hatch.version]
path = "src/pydantic_ogcapi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ogcapi"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
